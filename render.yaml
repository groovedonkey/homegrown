services:
  - type: web
    name: homegrown-api
    runtime: python
    plan: free
    region: oregon
    rootDir: homegrown_project/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        value: CHANGE_ME
      - key: HOMEGROWN_DEV_FALLBACK
        value: "0"
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.6"
